<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ForjaOS - SDDM Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0A0D14;
    }
    .font-mono {
      font-family: 'Fira Code', monospace;
    }
    .glass-card {
      background: rgba(15, 19, 29, 0.78);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(0, 229, 255, 0.18);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px -10px rgba(0, 229, 255, 0.15);
    }
    .glow-input:focus {
      outline: none;
      border-color: #00E5FF;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.25);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-screen text-slate-200 relative flex flex-col justify-between overflow-hidden select-none">

  <!-- Fundo 4K Wallpaper Oficial ForjaOS -->
  <div class="absolute inset-0 z-0 bg-cover bg-center transition-all duration-700" style="background-image: url('https://lh3.googleusercontent.com/aida/ALJJyrBJR3Ib_O5WYry9vIkBuQ1okK6NXhHnO6Td4grENMqbwgNxUCYWKugDj1T6e_Aj-qB3VV_EffBJV_hUHxyMy-fktkfwZnxv3YOtQbQswcpyqoGUQ9XUd0lIGhcFJAZVlXur3biRBe7O75_gxttvwKhBpH0_UUxflfiLSK3wjtfwAtaasaL4-WW3NvhP4M5jeB-M8aNpUbvO6xFhTaFjkdOTKxphezHaUVXu5lTraX9A');">
    <!-- Darkening Vignette Layer -->
    <div class="absolute inset-0 bg-gradient-to-t from-[#0A0D14] via-[#0A0D14]/50 to-[#0A0D14]/80 backdrop-blur-[2px]"></div>
  </div>

  <!-- Top Bar: Data, Hora, Indicadores de Hardware e Rede -->
  <header class="relative z-20 px-10 py-6 flex items-center justify-between">
    <!-- Identidade do Sistema -->
    <div class="flex items-center gap-3 bg-slate-950/40 border border-slate-800/60 rounded-full px-4 py-2 backdrop-blur-md">
      <img src="https://lh3.googleusercontent.com/aida/ALJJyrDlPs-k51C-0TPJse4gs3TQQWlxL3mprtcMOAkHKrNBzkC10ffpBvCNL0U9nkJLILa9g3qTlCRyKbfea8FBZgujCbcIwEBv7i4pf5kbhLW9NBeoEQkbOWQlPTRqtL89GkCJL2cH3WwF3pWjohSoTe9ZNS1LtCArenRDWtlMdfwEs8YLwLt3LakMbMFrnt7OzbokAZR6zrVIEvIlxGt6q3ZiEVQR0kqGdA52NNmqylcqdw" alt="Logo ForjaOS" class="w-6 h-6 rounded-md">
      <span class="text-sm font-bold text-white tracking-wide">FORJA<span class="text-[#00E5FF]">OS</span></span>
      <span class="text-[11px] text-slate-400 font-mono pl-1 border-l border-slate-700">KDE Plasma 6.2 · Wayland</span>
    </div>

    <!-- Relógio & Data Centralizados no topo -->
    <div class="absolute left-1/2 -translate-x-1/2 text-center hidden md:block">
      <div class="text-4xl font-extrabold text-white tracking-tight font-mono">14:32</div>
      <div class="text-xs text-slate-400 font-medium">Domingo, 8 de Novembro de 2026</div>
    </div>

    <!-- Status de Hardware, Bateria e Acessibilidade -->
    <div class="flex items-center gap-3">
      <!-- Módulo de Rede -->
      <div class="flex items-center gap-2 bg-slate-950/40 border border-slate-800/60 rounded-full px-3.5 py-1.5 backdrop-blur-md text-xs font-mono text-slate-300">
        <svg class="w-3.5 h-3.5 text-[#00E5FF]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"></path>
        </svg>
        <span>DevLab 5G</span>
      </div>

      <!-- Bateria / Alimentação -->
      <div class="flex items-center gap-1.5 bg-slate-950/40 border border-slate-800/60 rounded-full px-3 py-1.5 backdrop-blur-md text-xs font-mono text-slate-300">
        <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
        </svg>
        <span>98%</span>
      </div>

      <!-- Seletor de Sessão Desktop -->
      <div class="relative group">
        <button class="flex items-center gap-2 bg-slate-950/40 border border-slate-800/60 hover:border-cyan-500/40 rounded-full px-3.5 py-1.5 backdrop-blur-md text-xs font-mono text-slate-300 transition-all">
          <svg class="w-3.5 h-3.5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
          </svg>
          <span class="text-white font-medium">Plasma 6 (Wayland)</span>
          <svg class="w-3 h-3 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </button>
      </div>

      <!-- Botão Power -->
      <button class="w-8 h-8 rounded-full bg-slate-950/50 border border-slate-800/70 hover:border-rose-500/50 hover:text-rose-400 flex items-center justify-center text-slate-400 transition-all" title="Opções de Energia">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Login Card Central (SDDM) -->
  <main class="relative z-20 flex-1 flex items-center justify-center p-6">
    <div class="glass-card rounded-3xl p-8 max-w-md w-full text-center flex flex-col items-center">
      
      <!-- Avatar do Usuário com anel de status neon -->
      <div class="relative mb-5 group cursor-pointer">
        <div class="w-24 h-24 rounded-2xl p-1 bg-gradient-to-tr from-[#00E5FF] via-[#6366F1] to-[#8B5CF6] shadow-lg shadow-cyan-500/20">
          <div class="w-full h-full rounded-[14px] bg-[#0F131D] flex items-center justify-center overflow-hidden">
            <!-- Avatar ilustrado de dev com tema cyberpunk suave -->
            <div class="w-full h-full bg-gradient-to-b from-slate-800 to-slate-950 flex flex-col items-center justify-center">
              <svg class="w-12 h-12 text-[#00E5FF]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
            </div>
          </div>
        </div>
        <!-- Badge indicador de sessão local HERO pronta -->
        <div class="absolute -bottom-1 -right-1 w-6 h-6 rounded-full bg-[#0A0D14] border-2 border-[#00E5FF] flex items-center justify-center text-[10px] text-[#00E5FF] font-bold" title="HERO Daemon Ativo">
          ⚡
        </div>
      </div>

      <!-- Nome do Desenvolvedor -->
      <h2 class="text-xl font-bold text-white tracking-wide mb-1">Rodrigo</h2>
      <div class="flex items-center gap-2 text-xs text-slate-400 font-mono mb-6">
        <span class="text-cyan-400">rodrigo@devos</span>
        <span>•</span>
        <span class="text-slate-500">Full-Stack / Gamedev</span>
      </div>

      <!-- Campo de Autenticação / Senha -->
      <form class="w-full space-y-4" onsubmit="event.preventDefault();">
        <div class="relative">
          <input 
            type="password" 
            placeholder="Digite sua senha ou use chave de segurança..." 
            autofocus 
            value="••••••••••••"
            class="glow-input w-full bg-[#0A0E18]/80 text-white placeholder-slate-500 text-sm px-4 py-3.5 pr-12 rounded-xl border border-slate-700/80 transition-all font-mono"
          >
          <button 
            type="submit" 
            class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-lg bg-gradient-to-r from-[#00E5FF] to-[#6366F1] text-slate-950 font-bold flex items-center justify-center hover:opacity-90 transition-all shadow-md shadow-cyan-500/20"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
            </svg>
          </button>
        </div>

        <!-- Opções de Autenticação Alternativa (KWallet / FIDO2 / MOK) -->
        <div class="flex items-center justify-between text-xs text-slate-400 pt-2 font-mono">
          <button type="button" class="hover:text-cyan-400 flex items-center gap-1.5 transition-colors">
            <svg class="w-3.5 h-3.5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path>
            </svg>
            <span>FIDO2 / YubiKey</span>
          </button>
          
          <button type="button" class="hover:text-cyan-400 flex items-center gap-1.5 transition-colors">
            <svg class="w-3.5 h-3.5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 004 11a7.96 7.96 0 001.328 4.412"></path>
            </svg>
            <span>Biometria</span>
          </button>
        </div>
      </form>

      <!-- Seletor de Perfil ou Troca de Usuário -->
      <div class="mt-8 pt-5 border-t border-slate-800/70 w-full flex items-center justify-between text-xs text-slate-500">
        <button class="hover:text-slate-300 flex items-center gap-1 transition-colors">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
          <span>Outro usuário</span>
        </button>
        <span class="text-cyan-400/90 font-mono text-[11px] bg-cyan-950/40 px-2 py-0.5 rounded border border-cyan-500/20">Modo Desenvolvedor</span>
      </div>

    </div>
  </main>

  <!-- Rodapé SDDM: Atalhos e Ações Rápidas -->
  <footer class="relative z-20 px-10 py-5 flex items-center justify-between text-xs text-slate-500 font-mono">
    <div class="flex items-center gap-5">
      <span>Layout: <strong class="text-slate-300">ABNT2 (pt-BR)</strong></span>
      <span>•</span>
      <span>Sessão: <strong class="text-slate-300">Wayland</strong></span>
      <span>•</span>
      <span class="text-emerald-400 flex items-center gap-1">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
        NVIDIA PRIME Offload Ativo
      </span>
    </div>

    <!-- Controles de Energia inferiores -->
    <div class="flex items-center gap-4 text-slate-400">
      <button class="hover:text-white transition-colors flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        <span>Suspender</span>
      </button>
      <button class="hover:text-white transition-colors flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        <span>Reiniciar</span>
      </button>
      <button class="hover:text-rose-400 transition-colors flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-12.728 0m0 0l2.829-2.829m-2.829 2.829L3 21m2.828-12.536a5 5 0 017.072 0"></path></svg>
        <span>Desligar</span>
      </button>
    </div>
  </footer>

</body>
</html>
